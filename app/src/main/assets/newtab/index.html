<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>New tab</title>
<style>
  :root {
    --bg: #07070a; --text: #e2e8f0; --dim: rgba(226,232,240,.55);
    --glow1: rgba(168,85,247,.18); --glow2: rgba(226,232,240,.07);
    --field: rgba(226,232,240,.06); --border: rgba(226,232,240,.2); --focus: #e2e8f0;
    --hi: rgba(255,255,255,.07);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --text: #1e1b2e; --dim: rgba(30,27,46,.5);
      --glow1: rgba(168,85,247,.12); --glow2: rgba(56,189,248,.09);
      --field: #fff; --border: rgba(30,27,46,.14); --focus: #7c3aed; --hi: rgba(255,255,255,.9);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(900px 500px at 15% -10%, var(--glow1), transparent 70%),
      radial-gradient(800px 500px at 90% 110%, var(--glow2), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; gap: 26px;
  }
  img { width: 150px; height: 150px; filter: drop-shadow(0 10px 30px rgba(168,85,247,.25)); }
  @media (prefers-color-scheme: dark) { img { filter: drop-shadow(0 0 24px rgba(226,232,240,.18)) drop-shadow(0 10px 30px rgba(168,85,247,.3)); } }
  h1 { margin: -12px 0 0; font-weight: 600; letter-spacing: .32em; font-size: 15px; color: var(--dim); }
  form { width: min(620px, 100%); }
  input {
    width: 100%; height: 52px; padding: 0 22px; border: none; outline: none; border-radius: 999px;
    background: var(--field); color: var(--text); font: inherit; font-size: 17px;
    box-shadow: inset 0 0 0 1px var(--border), inset 0 1px 0 var(--hi);
    backdrop-filter: blur(14px);
  }
  input:focus { box-shadow: inset 0 0 0 1.5px var(--focus), inset 0 1px 0 var(--hi); }
  input::placeholder { color: var(--dim); }
  .clock { font-size: 13px; color: var(--dim); letter-spacing: .08em; }
</style>
</head>
<body>
  <img src="umbra.png" alt="">
  <h1>UMBRA</h1>
  <form id="f" autocomplete="off">
    <input id="q" type="search" enterkeyhint="go" placeholder="Search or enter address" dir="auto">
  </form>
  <div class="clock" id="clock"></div>
<script>
  const engines = {
    google: "https://www.google.com/search?q=%s",
    duckduckgo: "https://duckduckgo.com/?q=%s",
    bing: "https://www.bing.com/search?q=%s",
    brave: "https://search.brave.com/search?q=%s",
    startpage: "https://www.startpage.com/do/search?q=%s"
  };
  const engine = engines[new URLSearchParams(location.search).get("engine")] || engines.google;
  if ((navigator.language || "").startsWith("ar")) {
    document.getElementById("q").placeholder = "ابحث أو اكتب عنوان";
    document.documentElement.dir = "rtl";
  }
  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const t = document.getElementById("q").value.trim();
    if (!t) return;
    let url;
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(t) || /^about:/i.test(t)) url = t;
    else if (!/\s/.test(t) && (/^[^\s\/]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(t) || /^localhost(:\d+)?/.test(t))) url = "https://" + t;
    else url = engine.replace("%s", encodeURIComponent(t));
    location.href = url;
  });
  const clock = () => document.getElementById("clock").textContent =
    new Date().toLocaleString(undefined, { weekday: "long", hour: "2-digit", minute: "2-digit" });
  clock(); setInterval(clock, 15000);
</script>
</body>
</html>
