<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Page not loaded</title>
<style>
  :root { --bg: #07070a; --text: #e2e8f0; --dim: rgba(226,232,240,.6); --btn: rgba(226,232,240,.08); --border: rgba(226,232,240,.22); }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f5f9; --text: #1e1b2e; --dim: rgba(30,27,46,.6); --btn: #fff; --border: rgba(30,27,46,.16); } }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(700px 400px at 50% 0%, rgba(168,85,247,.16), transparent 70%), var(--bg);
    color: var(--text); font: 16px system-ui, sans-serif; padding: 24px; text-align: center; }
  img { width: 96px; height: 96px; opacity: .9; }
  h1 { font-size: 20px; margin: 6px 0 0; font-weight: 600; }
  p { color: var(--dim); margin: 0; max-width: 520px; word-break: break-all; }
  button { margin-top: 10px; height: 44px; padding: 0 26px; border-radius: 999px; border: none; font: inherit; color: var(--text);
    background: var(--btn); box-shadow: inset 0 0 0 1px var(--border); }
</style>
</head>
<body>
  <img src="umbra.png" alt="">
  <h1 id="t">This page could not be loaded</h1>
  <p id="u"></p>
  <p id="d"></p>
  <button id="b">Try again</button>
<script>
  const q = new URLSearchParams(location.search);
  const url = q.get("url") || "";
  const ar = (navigator.language || "").startsWith("ar");
  const cat = Number(q.get("category"));
  const reasons = {
    3: ["Check your internet connection or the address.", "تأكد من الإنترنت أو من العنوان."],
    2: ["The site's security certificate is not valid.", "شهادة أمان الموقع مو صالحة."],
    4: ["The connection was interrupted.", "انقطع الاتصال."]
  };
  document.getElementById("u").textContent = url;
  document.getElementById("d").textContent = (reasons[cat] || ["Something went wrong while loading.", "صار خطأ بالتحميل."])[ar ? 1 : 0];
  if (ar) {
    document.documentElement.dir = "rtl";
    document.getElementById("t").textContent = "ما انفتحت الصفحة";
    document.getElementById("b").textContent = "حاول مرة ثانية";
  }
  document.getElementById("b").onclick = () => { if (url) location.href = url; };
</script>
</body>
</html>
