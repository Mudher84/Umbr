name: Build Umbra APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: SDK packages
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: uBlock Origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-ublock.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/
          ls -la out
          ./gradlew -q --no-daemon :app:dependencies --configuration releaseRuntimeClasspath | grep -m1 geckoview | tee out/engine.txt

      - uses: actions/upload-artifact@v4
        with:
          name: umbra-apks
          path: out/

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --title "Umbra latest build" --notes "Unsigned build from ${GITHUB_SHA::7}. Signed APKs are made from these." --prerelease
